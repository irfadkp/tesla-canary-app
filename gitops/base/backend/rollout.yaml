apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: tesla-backend
  labels:
    app: tesla-backend
    component: api
spec:
  replicas: 3
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: tesla-backend
  template:
    metadata:
      labels:
        app: tesla-backend
        app.kubernetes.io/name: tesla-app
        app.kubernetes.io/part-of: tesla-canary
        component: api
    spec:
      # Init container copies the Instana Spring Boot javaagent jar from the
      # node-local agent repo (hostPath) into a shared emptyDir volume so the
      # main container can attach it with -javaagent at startup without
      # needing internet access or credentials at image build time.
      initContainers:
      - name: instana-agent-init
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            SRC=/opt/instana/agent/data/repo/com/instana/sensor-springboot-javaagent/1.1.49/sensor-springboot-javaagent-1.1.49.jar
            DST=/instana/instana-java-agent.jar
            if [ -f "$SRC" ]; then
              cp "$SRC" "$DST"
              echo "[Instana init] agent jar copied: $DST"
            else
              echo "[Instana init] WARNING: agent jar not found at $SRC — traces disabled"
            fi
        volumeMounts:
        - name: instana-agent-jar
          mountPath: /instana
        - name: instana-agent-repo
          mountPath: /opt/instana/agent/data/repo
          readOnly: true
      containers:
      - name: backend
        image: tesla-backend
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: database.host
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: database.port
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: database.name
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: database.user
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: database.password
        - name: INSTANA_AGENT_HOST
          value: "instana-agent.instana-agent"
        - name: INSTANA_AGENT_PORT
          value: "42699"
        - name: INSTANA_SERVICE_NAME
          value: "tesla-backend"
        - name: INSTANA_ZONE
          value: "tesla-canary"
        - name: INSTANA_TAGS
          value: "app=tesla,deployment=canary,component=backend"
        volumeMounts:
        - name: instana-agent-jar
          mountPath: /instana
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: instana-agent-jar
        emptyDir: {}
      - name: instana-agent-repo
        hostPath:
          path: /opt/instana/agent/data/repo
          type: Directory
  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause: {duration: 2m}
      - analysis:
          templates:
            - templateName: instana-canary-analysis
          args:
            - name: pod-template-hash
              valueFrom:
                podTemplateHashValue: Latest
      - setWeight: 50
      - pause: {duration: 2m}
      - analysis:
          templates:
            - templateName: instana-canary-analysis
          args:
            - name: pod-template-hash
              valueFrom:
                podTemplateHashValue: Latest
      canaryService: tesla-backend-canary
      stableService: tesla-backend-stable