apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: tesla-backend-analysis
spec:
  metrics:
  - name: always-fail
    interval: 10s
    failureLimit: 1
    provider:
      job:
        spec:
          template:
            spec:
              containers:
              - name: analysis
                image: alpine:3.19
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    echo "Analysis check - intentionally failing for Degraded demo"
                    exit 1
              restartPolicy: Never
          backoffLimit: 0
