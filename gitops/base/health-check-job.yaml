apiVersion: batch/v1
kind: Job
metadata:
  name: tesla-health-check
  labels:
    app: tesla-health-check
    app.kubernetes.io/name: tesla-app
    app.kubernetes.io/part-of: tesla-canary
    component: health-check
spec:
  backoffLimit: 0  # Don't retry
  ttlSecondsAfterFinished: 300  # Keep for 5 minutes after completion
  template:
    metadata:
      labels:
        app: tesla-health-check
        app.kubernetes.io/name: tesla-app
        app.kubernetes.io/part-of: tesla-canary
        component: health-check
    spec:
      restartPolicy: Never
      containers:
      - name: health-checker
        image: alpine:3.19
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Tesla Health Check - Simulating degraded state for ArgoCD monitoring"
            echo "This job intentionally fails to demonstrate ArgoCD health status detection"
            echo "All application pods remain healthy"
            exit 1